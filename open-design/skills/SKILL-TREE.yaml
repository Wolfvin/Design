# ═══════════════════════════════════════════════════════════════
# SKILL-TREE — Navigasi lengkap skill dalam satu bacaan
# ═══════════════════════════════════════════════════════════════
#
# Cara pakai (AI):
#   1. Baca file ini → pilih branch yang paling relevan
#   2. Cari twig yang sesuai → lihat daun-daunnya
#   3. Langsung baca SKILL.md skill yang dibutuhkan
#   4. Tidak perlu baca semua — stop kapanpun sudah confident
#
# Konvensi:
#   - Setiap skill existing punya frontmatter skill-tree: {type: leaf, parent: twig-xxx}
#   - Skill yang cocok di lebih dari 1 twig punya also-matches
#   - Tidak ada folder navigasi — pohon ini sepenuhnya logis, bukan fisik
#
# ═══════════════════════════════════════════════════════════════

motion:
  description: "Animasi, GSAP, motion design, interaksi, 3D, shader"
  twigs:

    motion-principles:
      description: "Kapan & bagaimana animasi — taste, polish, prinsip gerak"
      leaves:
        - name: taste-skill
          note: "Visual taste & judgment"
        - name: impeccable-design-polish
          note: "Polish & finishing detail"
        - name: emilkowalski-motion
          note: "Motion design prinsip by Emil Kowalski"
        - name: algorithmic-art
          note: "Generative & algorithmic animation"
        - name: d3-visualization
          note: "D3.js charts & interactive data visualization"

    gsap:
      description: "GSAP library — dari core sampai framework integration"
      leaves:
        - name: gsap-core
          note: "Core API: to(), from(), fromTo(), easing, stagger"
        - name: gsap-timeline
          note: "Timeline sequencing & orchestration"
        - name: gsap-scrolltrigger
          note: "Scroll-linked animation"
        - name: gsap-plugins
          note: "Flip, Draggable, MorphSVG, dll"
        - name: gsap-react
          note: "GSAP in React with useGSAP"
        - name: gsap-utils
          note: "clamp, mapRange, random, distribute"
        - name: gsap-performance
          note: "Performa & optimasi animasi"
        - name: gsap-frameworks
          note: "Vue, Svelte, Angular integration"

    css-animation:
      description: "Animasi framework-based, canvas, & remotion"
      leaves:
        - name: flutter-animating-apps
          note: "Animasi di Flutter"
        - name: remotion
          note: "React-based video & animation"
          also-matches: [twig-video-tools]
        - name: canvas-design
          note: "Canvas-based visual & animasi"

    3d-motion:
      description: "WebGL, shader, Three.js, 3D interaksi"
      leaves:
        - name: shader-dev
          note: "GLSL & shader programming"
        - name: threejs
          note: "Three.js 3D scenes & interaction"
        - name: fal-3d
          note: "3D generation via fal.ai"
        - name: web-shader-extractor
          note: "Extract shaders from websites"
          also-matches: [twig-component]

